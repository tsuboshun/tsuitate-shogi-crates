[package]
name = "tsuitate_bindings"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[features]
python = ["pyo3/extension-module"]

[dependencies]
wasm-bindgen = "0.2.104"
js-sys = "0.3.81"
tsify-next = "0.5.6"
web-sys = { version = "0.3.81", features = ["console"] }
pyo3 = { version = "0.28.3", optional = true, features = ["abi3-py38"] }

shogi_core = "0.1.5"
shogi_usi_parser = "0.1.0"
shogi_legality_extended = { path = "../shogi_legality_extended" }
tsuitate_game = { path = "../tsuitate_game" }
